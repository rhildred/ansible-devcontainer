---
- name: Deploy Forgejo, Coder, and CUDA Environment
  hosts: localhost
  become: true
  tasks:
    - name: Ensure keyrings directory exists
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Download Docker GPG key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: '0644'

    - name: Add Docker repository (Noble)
      ansible.builtin.apt_repository:
        repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu noble stable"
        state: present
        filename: docker

    - name: Install Docker Engine
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        update_cache: yes

    # 2. NVIDIA Container Toolkit
    - name: Download NVIDIA GPG key
      ansible.builtin.get_url:
        url: https://github.io
        dest: /etc/apt/keyrings/nvidia-container-toolkit-keyring.gpg
        mode: '0644'

    - name: Add NVIDIA repository
      ansible.builtin.apt_repository:
        repo: "deb [signed-by=/etc/apt/keyrings/nvidia-container-toolkit-keyring.gpg] https://github.io /"
        state: present
        filename: nvidia-container-toolkit

    - name: Install NVIDIA Container Toolkit
      ansible.builtin.apt:
        name: nvidia-container-toolkit
        update_cache: yes

    - name: Configure Docker NVIDIA runtime
      ansible.builtin.command: nvidia-ctk runtime configure --runtime=docker
      notify: Restart Docker

    - name: Install Forgejo via EasyForgejo script
      shell: curl -sSL https://wkoszek.github.io/easyforgejo/install.sh | bash
      args:
        creates: /usr/local/bin/forgejo

    - name: Install Coder via official script
      shell: curl -L https://coder.com/install.sh | sh
      args:
        creates: /usr/bin/coder

    - name: Setup and start Coder
      systemd:
        name: coder
        state: started
        enabled: yes
        daemon_reload: yes