---
- name: Deploy Forgejo, Coder, and CUDA Environment
  hosts: localhost
  become: true
  tasks:
    # 1. Clear previous interrupted dpkg states
    - name: Fix interrupted package installations
      command: dpkg --configure -a
      changed_when: false

    # 2. Setup Prerequisites and Repositories
    - name: Install prerequisite packages
      apt:
        name: [ca-certificates, curl, gnupg]
        state: present
        update_cache: yes


    - name: Ensure keyrings directory exists
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Download Docker GPG key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: '0644'

    - name: Add Docker repository (Noble)
      ansible.builtin.apt_repository:
        repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu noble stable"
        state: present
        filename: docker

    - name: Install Docker Engine
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        update_cache: yes

    - name: Install Forgejo via EasyForgejo script
      shell: curl -sSL https://wkoszek.github.io/easyforgejo/install.sh | bash > tail -23 > FORGEJO.md
      args:
        creates: /usr/local/bin/forgejo

    - name: Get status of the file
      ansible.builtin.stat:
        path: FORGEJO.md
      register: file_info

    - name: Debug if file exists
      ansible.builtin.debug:
        msg: "Read FORGEJO.md for further instructions."
      when: file_info.stat.exists