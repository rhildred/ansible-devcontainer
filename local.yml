---
- name: Deploy Forgejo, Coder, and CUDA Environment
  hosts: localhost
  become: true
  vars:
    # Database credentials (change these!)
    db_forgejo_pass: "Cid1wchn" 
    pg_hba_path: "/etc/postgresql/16/main/pg_hba.conf"
 
  tasks:
    # 1. Clear previous interrupted dpkg states
    - name: Fix interrupted package installations
      command: dpkg --configure -a
      changed_when: false

    # 2. Setup Prerequisites and Repositories
    - name: Install prerequisite packages
      apt:
        name: [ca-certificates, curl, gnupg]
        state: present
        update_cache: yes


    - name: Ensure keyrings directory exists
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Download Docker GPG key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: '0644'

    - name: Add Docker repository (Noble)
      ansible.builtin.apt_repository:
        repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu noble stable"
        state: present
        filename: docker

    - name: Install Docker Engine
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        update_cache: yes
    - name: Ensure the docker group exists
      ansible.builtin.group:
        name: docker
        state: present

    - name: Add the current user to the docker group
      ansible.builtin.user:
        # Use ansible_user (the user used for login) or lookup env USER
        name: "{{ ansible_user | default(lookup('env', 'USER')) }}"
        groups: docker
        append: yes
      notify: refresh_ssh

      # 1. Install PostgreSQL and Python bindings (required for Ansible modules)
    - name: Install PostgreSQL and psycopg2
      ansible.builtin.apt:
        name: 
          - postgresql
          - postgresql-contrib
          - python3-psycopg2
        state: present
        update_cache: yes

    - name: Ensure PostgreSQL is running
      ansible.builtin.systemd:
        name: postgresql
        state: started
        enabled: yes

    # 2. Create Databases and Users

    - name: Create database user for Forgejo
      community.postgresql.postgresql_user:
        name: forgejo
        password: "{{ db_forgejo_pass }}"
      become_user: postgres

    - name: Create Forgejo database
      community.postgresql.postgresql_db:
        name: forgejodb
        owner: forgejo
      become_user: postgres

    - name: Grant USAGE on public schema to forgejo
      community.postgresql.postgresql_privs:
        db: "forgejodb"
        type: schema        # When type is schema...
        objs: public        # ...the schema name goes here
        roles: forgejo
        privs: USAGE
        # schema: public    <-- REMOVE THIS LINE
      become: true
      become_user: postgres
    - name: (Optional) Set default privileges for future tables
      community.postgresql.postgresql_privs:
        db: "forgejodb"
        schema: public
        objs: TABLES
        type: default_privs
        roles: forgejo
        privs: ALL
        target_roles: postgres
      become: true
      become_user: postgres
    - name: Create the table for devcontainers
      community.postgresql.postgresql_table:
        db: "forgejodb"
        name: "devcontainers"
        columns:
          - id TEXT primary key
          - username text not null
          - branch text not null
          - repo_url TEXT not null
          - accessed_at timestamp default now()
          - created_at timestamp default now()
        state: present
      become: true
      become_user: postgres

    - name: Create a standard index on username
      community.postgresql.postgresql_idx:
        db: forgejodb
        table: devcontainers
        columns: username
        name: idx_username
        state: present
      become: yes
      become_user: postgres      

    - name: Configure Postgres to listen on all IPv4 addresses
      community.postgresql.postgresql_set:
        name: listen_addresses
        value: "*"
      become_user: postgres
      notify: Restart PostgreSQL

    - name: Allow all IPv4 addresses in pg_hba.conf
      community.postgresql.postgresql_pg_hba:
        dest: "{{ pg_hba_path }}"
        contype: host
        databases: all
        users: all
        source: "0.0.0.0/0"
        method: scram-sha-256
      become_user: postgres
      notify: Restart PostgreSQL


    - name: Install Forgejo via EasyForgejo script
      shell: curl -sSL https://wkoszek.github.io/easyforgejo/install.sh | bash | tail -23 > FORGEJO.md
      args:
        creates: /usr/local/bin/forgejo

    - name: Get status of the file
      ansible.builtin.stat:
        path: FORGEJO.md
      register: file_info

    - name: Debug if file exists
      ansible.builtin.debug:
        msg: "Read FORGEJO.md for further instructions."
      when: file_info.stat.exists

  handlers:
    - name: refresh_ssh
      ansible.builtin.meta: reset_connection
    - name: Restart PostgreSQL
      ansible.builtin.service:
        name: postgresql
        state: restarted
