---
- name: Configure Sovereign Skunkworks Node and Backup Lifecycle
  hosts: localhost
  connection: local
  become: true

  vars:
    deploy_user: "ubuntu"
    deploy_group: "ubuntu"
    host_uid: 1000
    host_gid: 1000
    docker_gid: 981
    compose_project_dir: "{{ playbook_dir }}" 

    storage_dirs:
      - /var/lib/forgejo
      - /var/lib/tabby
      - /var/lib/forgejo-runner
      # System level configuration directories
      - /etc/forgejo
      - /etc/forgejo/ssh
      

    borg_repo: "borgbackup@100.64.X.X:/mnt/borg_storage/repo_skunkworks"
    borg_passphrase: "your_secure_repository_passphrase_here"

  tasks:
    - name: Gather target network interface facts
      ansible.builtin.gather_facts:
        gather_subset:
          - network

    # Dynamically query the tailscale interface network configurations 
    - name: Determine Tailscale mesh IP address
      ansible.builtin.set_fact:
        tailscale_ip: "{{ ansible_facts['tailscale0']['ipv4']['address'] | default(ansible_facts['tailscale_0']['ipv4']['address']) }}"
      failed_when: tailscale_ip is not defined

    - name: Debug verified Tailscale target IP binding
      ansible.builtin.debug:
        msg: "Stack services will be locked down exclusively to interface IP: {{ tailscale_ip }}"

    - name: Ensure standard service data directories exist with clean ownership
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: "{{ deploy_user }}"
        group: "{{ deploy_group }}"
        mode: '0755'
      loop: "{{ storage_dirs }}"

    - name: Ensure host tools are installed
      ansible.builtin.package:
        name:
          - docker-compose-plugin
          - python3-pip
          - borgbackup
        state: present

    - name: Ensure Docker python SDK is installed
      ansible.builtin.pip:
        name: docker
        state: present

    - name: Deploy project .env file
      ansible.builtin.copy:
        dest: "{{ compose_project_dir }}/.env"
        owner: "{{ deploy_user }}"
        group: "{{ deploy_group }}"
        mode: '0600'
        content: |
          HOST_UID={{ host_uid }}
          HOST_GID={{ host_gid }}
          HOST_DOCKER_GID={{ docker_gid }}

    # Compiles the Jinja2 template into a fully evaluated docker-compose.yml file
    - name: Generate Tailscale-locked Docker Compose configuration
      ansible.builtin.template:
        src: "{{ compose_project_dir }}/docker-compose.yml.j2"
        dest: "{{ compose_project_dir }}/docker-compose.yml"
        owner: "{{ deploy_user }}"
        group: "{{ deploy_group }}"
        mode: '0644'

    - name: Run docker compose up -d
      community.docker.docker_compose_v2:
        project_src: "{{ compose_project_dir }}"
        state: present
        pull: always
      become: true
      become_user: "{{ deploy_user }}"

    - name: Deploy Host Backup Execution Script
      ansible.builtin.copy:
        dest: /usr/local/bin/skunkworks-backup.sh
        owner: root
        group: root
        mode: '0700'
        content: |
          #!/bin/bash
          set -euo pipefail

          export BORG_PASSPHRASE="{{ borg_passphrase }}"
          REPOSITORY="{{ borg_repo }}"
          BACKUP_DIRS="{{ storage_dirs | join(' ') }}"
          ARCHIVE_NAME="gpu-server-$(date +'%Y-%m-%d_%H%M%S')"

          echo "=== Freezing Stack Operations ==="
          docker pause forgejo tabby-server forgejo-runner node-proxy

          trap 'echo "Forcing cluster resume..."; docker unpause forgejo tabby-server forgejo-runner node-proxy' INT TERM EXIT

          echo "Executing Borg Snapshot: ${ARCHIVE_NAME}..."
          borg create --stats --compression lz4 "${REPOSITORY}::${ARCHIVE_NAME}" ${BACKUP_DIRS}

          echo "=== Restoring Stack Operations ==="
          docker unpause forgejo tabby-server forgejo-runner node-proxy
          trap - INT TERM EXIT

          echo "Pruning historical logs..."
          borg prune --list --keep-daily=7 --keep-weekly=4 --keep-monthly=6 "${REPOSITORY}"

    - name: Template Systemd Backup Service
      ansible.builtin.copy:
        dest: /etc/systemd/system/skunkworks-backup.service
        owner: root
        group: root
        mode: '0644'
        content: |
          [Unit]
          Description=Sovereign Pipeline Freeze Backup
          After=docker.service
          Requires=docker.service

          [Service]
          Type=oneshot
          ExecStart=/usr/local/bin/skunkworks-backup.sh

    - name: Template Systemd Backup Timer
      ansible.builtin.copy:
        dest: /etc/systemd/system/skunkworks-backup.timer
        owner: root
        group: root
        mode: '0644'
        content: |
          [Unit]
          Description=Daily Backup Loop Trigger

          [Timer]
          OnCalendar=*-*-* 03:00:00
          Persistent=true

          [Install]
          WantedBy=timers.target

    - name: Activate Systemd Backup Timer Loop
      ansible.builtin.systemd_service:
        name: skunkworks-backup.timer
        state: started
        enabled: true
        daemon_reload: true
