services:
  # 1. THE ARCHITECTURAL GATEWAY (Your Node Proxy)
  node-proxy:
    build: .
    volumes:
      - /home/ubuntu:/home/ubuntu
      - /var/run/docker.sock:/var/run/docker.sock
      - /etc/passwd:/etc/passwd:ro
      - /etc/group:/etc/group:ro
    tty: true 
    stdin_open: true
    user: "${HOST_UID}:${HOST_GID}"
    group_add:
      - "981"  # Host's docker group GID
    ports:
      - "8000:8000"
    networks:
      - proxy-tier
    environment:
      - NODE_ENV=production
      - FORGEJO_URL=https://k3p.dev
      - DOMAIN=.k3p.dev
      - CALLBACK_URL=https://k3p.dev
      - CLIENT_ID=49eef9d2-d78e-4f6b-b641-ee71f134bb11
      - CLIENT_SECRET=gto_aczfnv4owq7vt72yill74ed7kd2n5sdngeuvgf6lzkizmbd4ocuq
    restart: always

  # 2. SOVEREIGN SOURCE CONTROL (Forgejo)
  forgejo:
    image: codeberg.org/forgejo/forgejo
    container_name: forgejo
    environment:
      - USER_UID=${HOST_UID}
      - USER_GID=${HOST_GID}
    volumes:
      - /var/lib/forgejo:/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "3000:3000"
      - "2222:22"
    networks:
      - proxy-tier
    restart: always

  # 3. SELF-HOSTED AI PAIR PROGRAMMER (Tabby Server)
  tabby:
    image: tabbyml/tabby
    container_name: tabby-server
    # Update the model path to utilize the heavily optimized MoE structure
    command: serve --model Qwen/Qwen3-Coder-Next-80B-GGUF --device cuda
    volumes:
      - /var/lib/tabby:/data
    ports:
      - "8080:8080"
    networks:
      - proxy-tier
    environment:
      - NVIDIA_VISIBLE_DEVICES=0
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: always

  # 4. HARDWARE-ACCELERATED CI/CD (Forgejo Runner)
  forgejo-runner:
    image: codeberg.org/forgejo/runner
    container_name: forgejo-runner
    depends_on:
      - forgejo
    volumes:
      - /var/lib/forgejo-runner:/data
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - proxy-tier
    environment:
      - FORGEJO_RUNNER_LABELS=ubuntu-latest:docker://node:20-bookworm,gpu-accelerated:docker://nvidia/cuda:12.6.0-base-ubuntu22.04
      - NVIDIA_VISIBLE_DEVICES=1 # Pins CI/CD jobs strictly to GPU 1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: always

networks:
  proxy-tier:
    name: proxy-tier
